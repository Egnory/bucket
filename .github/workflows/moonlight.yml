name: Moonlight

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: moonlight-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Moonlight manifest
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          $repo = "qiin2333/moonlight-qt"
          $manifestPath = "bucket/moonlight.json"

          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GITHUB_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
            "User-Agent" = "Moonlight-Scoop-Updater"
          }

          # Get latest stable release
          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/$repo/releases/latest" `
            -Headers $headers

          $version = $release.tag_name -replace '^v', ''

          Write-Host "Latest stable version: $version"

          # Find x64 portable ZIP
          $assetName = "Moonlight-VPlus-Portable-x64-$version.zip"

          $asset = $release.assets |
            Where-Object { $_.name -eq $assetName } |
            Select-Object -First 1

          if (!$asset) {
            throw "Asset not found: $assetName"
          }

          # Load manifest
          $manifest = Get-Content $manifestPath -Raw |
            ConvertFrom-Json -AsHashtable

          if ($manifest.version -eq $version) {
            Write-Host "Already up to date: $version"
            exit 0
          }

          # Calculate SHA256
          $downloadPath = Join-Path $env:RUNNER_TEMP $assetName

          Invoke-WebRequest `
            -Uri $asset.browser_download_url `
            -OutFile $downloadPath

          $hash = (Get-FileHash `
            -Path $downloadPath `
            -Algorithm SHA256).Hash.ToLower()

          # Update manifest
          $manifest.version = $version
          $manifest.architecture."64bit".url = $asset.browser_download_url
          $manifest.architecture."64bit".hash = $hash

          $manifest |
            ConvertTo-Json -Depth 100 |
            Set-Content $manifestPath -Encoding utf8

          Write-Host "Updated Moonlight to $version"
          Write-Host "SHA256: $hash"

      - name: Commit changes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add bucket/moonlight.json

          git diff --cached --quiet

          if ($LASTEXITCODE -eq 1) {
            git commit -m "Update moonlight"
            git push
          }
          elseif ($LASTEXITCODE -ne 0) {
            throw "Git diff failed."
          }
          else {
            Write-Host "No changes to commit."
          }
