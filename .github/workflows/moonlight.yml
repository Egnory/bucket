name: Moonlight

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: moonlight-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          repo="qiin2333/moonlight-qt"
          manifest="bucket/moonlight.json"

          mkdir -p bucket

          # Get latest stable release
          release=$(gh api "repos/$repo/releases/latest")
          version=$(jq -r '.tag_name | sub("^v"; "")' <<< "$release")

          # Find x64 portable ZIP
          asset=$(jq -ce \
            --arg name "Moonlight-VPlus-Portable-x64-$version.zip" \
            '.assets[] | select(.name == $name)' <<< "$release")

          url=$(jq -r '.browser_download_url' <<< "$asset")

          # Get SHA256
          hash=$(jq -r '.digest // empty | sub("^sha256:"; "")' <<< "$asset")

          if [[ -z "$hash" ]]; then
            download="$RUNNER_TEMP/moonlight.zip"
            curl -fsSL "$url" -o "$download"
            hash=$(sha256sum "$download" | cut -d ' ' -f 1)
          fi

          # Skip unchanged version
          if [[ -f "$manifest" ]] &&
             [[ "$(jq -r '.version' "$manifest")" == "$version" ]]; then
            echo "Already up to date: $version"
            exit 0
          fi

          # Create or update manifest
          if [[ -f "$manifest" ]]; then
            jq \
              --arg version "$version" \
              --arg url "$url" \
              --arg hash "$hash" \
              '.version = $version |
               .architecture."64bit".url = $url |
               .architecture."64bit".hash = $hash' \
              "$manifest" > "$RUNNER_TEMP/manifest.json"
          else
            jq -n \
              --arg version "$version" \
              --arg url "$url" \
              --arg hash "$hash" \
              '{
                version: $version,
                description: "Moonlight V+ game streaming client",
                homepage: "https://github.com/qiin2333/moonlight-qt",
                license: "GPL-3.0-only",
                architecture: {
                  "64bit": {
                    url: $url,
                    hash: $hash
                  }
                },
                pre_install: "if (!(Test-Path \"$persist_dir$($cfg = '\''/Moonlight Game Streaming Project'\'')\")) { $null = New-Item -ItemType Directory \"$dir$cfg\" }",
                bin: "Moonlight.exe",
                persist: "Moonlight Game Streaming Project",
                checkver: {
                  github: "https://github.com/qiin2333/moonlight-qt"
                },
                autoupdate: {
                  architecture: {
                    "64bit": {
                      url: "https://github.com/qiin2333/moonlight-qt/releases/download/v$version/Moonlight-VPlus-Portable-x64-$version.zip"
                    }
                  }
                }
              }' > "$RUNNER_TEMP/manifest.json"
          fi

          mv "$RUNNER_TEMP/manifest.json" "$manifest"

          echo "Updated Moonlight to $version"

      - name: Commit changes
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add bucket/moonlight.json

          if ! git diff --cached --quiet; then
            git commit -m "Update moonlight"
            git push
          fi
