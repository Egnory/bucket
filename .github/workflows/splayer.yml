name: Splayer

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: splayer-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          repo="SPlayer-Dev/SPlayer-Next"
          manifest="bucket/splayer.json"

          release=$(gh api "repos/$repo/releases/latest")
          version=$(jq -r '.tag_name | sub("^v"; "")' <<< "$release")
          asset=$(jq -ce --arg name "SPlayer-Next-$version-x64-portable.exe" \
            '.assets[] | select(.name == $name)' <<< "$release")

          url=$(jq -r '.browser_download_url' <<< "$asset")
          hash=$(jq -r '.digest // empty | sub("^sha256:"; "")' <<< "$asset")

          if [[ -z "$hash" ]]; then
            hash=$(curl -fsSL "$url" | sha256sum | cut -d ' ' -f 1)
          fi

          if [[ "$(jq -r '.version' "$manifest")" == "$version" ]]; then
            echo "Already up to date: $version"
            exit 0
          fi

          jq --arg version "$version" --arg url "$url" --arg hash "$hash" \
            '.version = $version | .url = $url | .hash = $hash' \
            "$manifest" > "$RUNNER_TEMP/manifest.json"

          mv "$RUNNER_TEMP/manifest.json" "$manifest"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/splayer.json
          git diff --cached --quiet || {
            git commit -m "Update splayer"
            git push
          }
