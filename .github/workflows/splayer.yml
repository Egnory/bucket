name: Splayer

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: splayer-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          repo="SPlayer-Dev/SPlayer-Next"
          manifest="bucket/splayer.json"

          mkdir -p bucket

          release=$(gh api "repos/$repo/releases/latest")
          version=$(jq -er '.tag_name | sub("^v"; "")' <<< "$release")

          asset=$(jq -ce \
            --arg name "SPlayer-Next-$version-x64-portable.exe" \
            '.assets[] | select(.name == $name)' <<< "$release")

          url=$(jq -er '.browser_download_url' <<< "$asset")
          hash=$(jq -r '.digest // empty | sub("^sha256:"; "")' <<< "$asset")

          if [[ -z "$hash" ]]; then
            download="$RUNNER_TEMP/splayer.exe"
            curl -fL --retry 3 "$url" -o "$download"
            hash=$(sha256sum "$download" | cut -d ' ' -f 1)
          fi

          pre_install='Get-ChildItem "$dir" -Filter "SPlayer-Next-*-x64-portable.exe" | Select-Object -First 1 | Rename-Item -NewName "splayer.exe"'

          if [[ -f "$manifest" ]]; then
            jq \
              --arg version "$version" \
              --arg url "$url" \
              --arg hash "$hash" \
              --arg pre_install "$pre_install" \
              '
                .version = $version |
                .description = "SPlayer-Next music player" |
                .homepage = "https://github.com/SPlayer-Dev/SPlayer-Next" |
                .license = "AGPL-3.0" |
                .url = $url |
                .hash = $hash |
                .pre_install = [$pre_install] |
                .bin = "splayer.exe" |
                .persist = "UserData" |
                .autoupdate.url = "https://github.com/SPlayer-Dev/SPlayer-Next/releases/download/v$version/SPlayer-Next-$version-x64-portable.exe"
              ' "$manifest" > "$RUNNER_TEMP/manifest.json"
          else
            jq -n \
              --arg version "$version" \
              --arg url "$url" \
              --arg hash "$hash" \
              --arg pre_install "$pre_install" \
              '{
                version: $version,
                description: "SPlayer-Next music player",
                homepage: "https://github.com/SPlayer-Dev/SPlayer-Next",
                license: "AGPL-3.0",
                url: $url,
                hash: $hash,
                pre_install: [$pre_install],
                bin: "splayer.exe",
                persist: "UserData",
                autoupdate: {
                  url: "https://github.com/SPlayer-Dev/SPlayer-Next/releases/download/v$version/SPlayer-Next-$version-x64-portable.exe"
                }
              }' > "$RUNNER_TEMP/manifest.json"
          fi

          mv "$RUNNER_TEMP/manifest.json" "$manifest"

          echo "Manifest version: $version"
          echo "SHA256: $hash"
          echo "Manifest content:"
          cat "$manifest"

      - name: Commit changes
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add bucket/splayer.json

          if ! git diff --cached --quiet; then
            git commit -m "Update splayer"
            git push
          else
            echo "Manifest unchanged."
          fi
